<div class="code-block">
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <h4>{{ headerTitle }}</h4>
    </div>
    <div class="d-flex align-items-center">
      <app-crud-button
        [showSave]="!isEditMode"
        [showUpdate]="isEditMode"
        [showReset]="true"
        [showBack]="true"
        [isLoading]="isSaving"
        (onSave)="onSave()"
        (onUpdate)="onUpdate()"
        (onReset)="onReset()"
        (onBack)="onBack()"
      >
      </app-crud-button>
    </div>
  </div>
</div>

<div class="code-block shadow-sm mt-3">
  <form [formGroup]="cityForm" (ngSubmit)="onSave()">
    <div class="row g-3">
      <!-- Province -->
      <div class="col-lg-6 col-md-6 col-sm-12">
        <label class="form-label">
          Province <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Select Province"
            [value]="selectedProvinceName"
            disabled
            [class.is-invalid]="isFieldInvalid('provinceId')"
            [class.is-valid]="
              f['provinceId'].valid &&
              (f['provinceId'].touched || submitted) &&
              !hasFieldError('provinceId')
            "
          />
          <button class="btn btn-primary" style="border-radius: 0px !important;" type="button" (click)="openProvinceModal()">
            <i class="fa-solid fa-search"></i>
          </button>
        </div>
        <input type="hidden" formControlName="provinceId" />
        @if (isFieldInvalid('provinceId')) {
          <div class="invalid-feedback">{{ getFieldError('provinceId') }}</div>
        }
      </div>

      <!-- City Name -->
      <div class="col-lg-6 col-md-6 col-sm-12">
        <label class="form-label">
          City Name <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="cityName"
          placeholder="Enter City Name"
          alphaOnly
          (input)="onFieldChange('cityName')"
          [class.is-invalid]="isFieldInvalid('cityName')"
          [class.is-valid]="
            f['cityName'].valid &&
            (f['cityName'].touched || submitted) &&
            !hasFieldError('cityName')
          "
        />
        @if (isFieldInvalid('cityName')) {
          <div class="invalid-feedback">{{ getFieldError('cityName') }}</div>
        }
      </div>

      <!-- Status -->
      <div class="col-lg-6 col-md-6 col-sm-12">
        <label class="form-label">
          Status <span class="text-danger">*</span>
        </label>
        <select
          class="form-control"
          formControlName="isActive"
          (change)="onFieldChange('isActive')"
          [class.is-invalid]="isFieldInvalid('isActive')"
        >
          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        @if (isFieldInvalid('isActive')) {
          <div class="invalid-feedback">{{ getFieldError('isActive') }}</div>
        }
      </div>
    </div>
  </form>
</div>
