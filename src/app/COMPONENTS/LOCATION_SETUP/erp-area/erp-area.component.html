<div class="code-block">
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <h4>{{ headerTitle }}</h4>
    </div>
    <div class="d-flex align-items-center">
      <app-crud-button
        [showSave]="!isEditMode"
        [showUpdate]="isEditMode"
        [showReset]="true"
        [showBack]="true"
        [isLoading]="isSaving"
        (onSave)="onSave()"
        (onUpdate)="onUpdate()"
        (onReset)="onReset()"
        (onBack)="onBack()"
      >
      </app-crud-button>
    </div>
  </div>
</div>

<div class="code-block shadow-sm mt-3">
  <form [formGroup]="areaForm" (ngSubmit)="onSave()">
    <div class="row g-3">
      <!-- City -->
      <div class="col-lg-6 col-md-6 col-sm-12">
        <label class="form-label">
          City <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Select City"
            [value]="selectedCityName"
            disabled
            [class.is-invalid]="isFieldInvalid('cityId')"
            [class.is-valid]="
              f['cityId'].valid &&
              (f['cityId'].touched || submitted) &&
              !hasFieldError('cityId')
            "
          />
          <button class="btn btn-primary" style="border-radius: 0px !important;" type="button" (click)="openCityModal()">
            <i class="fa-solid fa-search"></i>
          </button>
        </div>
        <input type="hidden" formControlName="cityId" />
        @if (isFieldInvalid('cityId')) {
          <div class="invalid-feedback">{{ getFieldError('cityId') }}</div>
        }
      </div>

      <!-- Area Name -->
      <div class="col-lg-6 col-md-6 col-sm-12">
        <label class="form-label">
          Area Name <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="areaName"
          placeholder="Enter Area Name"
          alphaOnly
          (input)="onFieldChange('areaName')"
          [class.is-invalid]="isFieldInvalid('areaName')"
          [class.is-valid]="
            f['areaName'].valid &&
            (f['areaName'].touched || submitted) &&
            !hasFieldError('areaName')
          "
        />
        @if (isFieldInvalid('areaName')) {
          <div class="invalid-feedback">{{ getFieldError('areaName') }}</div>
        }
      </div>

      <!-- Postal Code -->
      <div class="col-lg-6 col-md-6 col-sm-12">
        <label class="form-label">
          Postal Code
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="postalCode"
          placeholder="Enter Postal Code"
          (input)="onFieldChange('postalCode')"
          [class.is-invalid]="isFieldInvalid('postalCode')"
          [class.is-valid]="
            f['postalCode'].valid &&
            (f['postalCode'].touched || submitted) &&
            !hasFieldError('postalCode')
          "
        />
        @if (isFieldInvalid('postalCode')) {
          <div class="invalid-feedback">{{ getFieldError('postalCode') }}</div>
        }
      </div>

      <!-- Status -->
      <div class="col-lg-6 col-md-6 col-sm-12">
        <label class="form-label">
          Status <span class="text-danger">*</span>
        </label>
        <select
          class="form-control"
          formControlName="isActive"
          (change)="onFieldChange('isActive')"
          [class.is-invalid]="isFieldInvalid('isActive')"
        >
          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        @if (isFieldInvalid('isActive')) {
          <div class="invalid-feedback">{{ getFieldError('isActive') }}</div>
        }
      </div>
    </div>
  </form>
</div>
