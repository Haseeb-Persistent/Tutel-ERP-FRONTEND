<div class="card-title-group" style="border-radius: none;">

    <!-- SAVE Button -->
    @if (showSave) {
    <button class="btn btn-round btn-xs btn-primary ml-1" [disabled]="isLoading" (click)="handleSave()">
        <span *ngIf="isLoading" class="isload"></span>
        <i class="fa-solid fa-floppy-disk me-1"></i> Save

    </button>
    }

    <!-- UPDATE Button -->
    @if (showUpdate) {
    <button class="btn btn-round btn-xs btn-primary ml-1" [disabled]="isLoading" (click)="handleUpdate()">
        <span *ngIf="isLoading" class="isload"></span>
        <i class="fa-solid fa-pen-to-square me-1"></i> Update
    </button>
    }

    <!-- AUTHORIZE Button -->
    @if (showAuthorize) {
    <button class="btn btn-round btn-xs btn-primary ml-1"  (click)="onAuthorize.emit()">
        <i class="fa-solid fa-check-circle me-1"></i> Authorize
    </button>
    }

    <!-- REJECT Button -->
    @if (showReject) {
    <button class="btn btn-round btn-xs btn-primary ml-1" (click)="onReject.emit()">
        <i class="fa-solid fa-times-circle me-1"></i> Reject
    </button>
    }

    <!-- VIEW CHANGE HISTORY Button -->
    @if (showViewChanges) {
    <button class="btn btn-round btn-xs btn-primary ml-1"  (click)="onViewChangeHistory.emit()">
        <i class="fa-solid fa-clock-rotate-left me-1"></i> View Change History
    </button>
    }

    <!-- RESET Button -->
    @if (showReset) {
    <button class="btn btn-round btn-xs btn-primary ml-1"[disabled]="isLoading" (click)="handleReset()">
        <span *ngIf="isLoading" class="isload"></span>
        <i class="fa-solid fa-rotate-right me-1"></i> Reset
    </button>
    }

    <!-- BACK Button -->
    @if (showBack) {
    <button class="btn btn-round btn-xs btn-primary ml-1"[disabled]="isLoading" (click)="handleBack()">
        <span *ngIf="isLoading" class="isload"></span>
        <i class="fa-solid fa-arrow-left me-1"></i> Back
    </button>
    }
</div>
